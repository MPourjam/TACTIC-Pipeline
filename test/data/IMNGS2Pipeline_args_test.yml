# The config yaml file for IMNGS2 Pipeline The arguemnts should be placed with the
# name of pipeline step (CamelCase) and the arguments added as indentaion to.
# If an argument parser exists with the same name of pipeline step (e.g: MergePairsArgs),
# then the arguments would be implemented in processing.
#####################
### Preprocessing ###
#####################
MergePairsArgs:
  fastq_maxdiffs: 50
  fastq_pctid: 50
  fastq_minmergelen: 200
  fastq_maxmergelen: 600
TrimBothSidesArgs:
  stripleft: 17  # for 341F primer (ref:https://probebase.csb.univie.ac.at/pb_report/probe/3844) Change only if you know exact lenght of you primers
  stripright: 21  # for 785R primer. Change only if you know exact lenght of you primers
TrimOneSideArgs:
  stripleft: 17  # for 341F primer (ref:https://probebase.csb.univie.ac.at/pb_report/probe/3844) Change only if you know exact lenght of you primers
FilterBothSidesArgs:
  fastq_maxee_rate: 0.002
FilterOneSideArgs:
  fastq_maxee_rate: 0.002
  fastq_truncqual: 10
IndividualSampleClusterZOTUsArgs:
  minsize: 2  # This value
Filter16SArgs:
  e: 0.1
  num_alignments: 1
# prepare_zotus:
BuildZOTUTableArgs:
  match_id: 0.99  # This value results more refined ZOTU count than 0.97 (default)
AddTaxArgs:
  turn: all
################
### Analysis ###
################
### Clustering pipelines ###
ClusterZOTUsArgs:
  minsize: 2  # This value filters out amplicons with less than 4 reads. Lower values higher sensitivity, but may result in more noise.
  abund_limit: 0.0025
  sample_wise_correction: false
  match_id: 0.99  # This value results more refined ZOTU count than 0.97 (default)
DeNovoClusterOTUsArgs:
  minsize: 9
  abund_limit: 0.0025
  sample_wise_correction: false
ComplexTICArgs:
  family_sim: 0.90
  genus_sim: 0.95
  species_sim: 0.987
  abund_limit: 0.0025  # Not implemented yet
  sample_wise_correction: false  # Not implemented yet
TACClusterArgs:
  abund_limit: 0.0025
  sample_wise_correction: false  # Not implemented yet
  cluster_thr: 0.987  # Not implemented yet
