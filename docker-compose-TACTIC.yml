version: '2'

services:
  tactic_pipeline:
    container_name: tactic_pipeline_cont
    build:
      context: .
      dockerfile: Dockerfile.TACTIC
      args:
        GIT_TAG: ${GIT_TAG:-NA}
    image: tactic_pipeline
    hostname: tactic
    volumes:
      - shared_data:/data:rw
    #   - /media/adminuser/CFM/inputs:/base/inputs
    #   - /media/adminuser/MSD-Storage/databases:/base/databases
    env_file:
      - ./.env
