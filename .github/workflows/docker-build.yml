name: Docker Image CI

on:
  push:
    tags:
      - 'v*'
  # Pull requests into main build the image and run the end-to-end tests in docker mode without publishing
  pull_request:
    branches: [main]
  # Manual runs (available once this file is on the default branch) do the same
  workflow_dispatch:

jobs:

  build:
    name: Build, test and publish docker image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and load image for testing
      uses: docker/build-push-action@v5
      with:
        context: .
        file: "./Dockerfile.TACTIC"
        load: true
        tags: tic-pipeline-test:latest
        secrets: |
          silva_app_token=${{ secrets.SILVA_APP_TOKEN }}
        build-args: |
          GIT_TAG=${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pre-Publish End-to-End Tests
      run: |
        SILVA_SOURCE=ftp pytest -v -m pre_publish tactic_pipeline/test/end_to_end/test_pipeline.py

    - name: Push to registry
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v5
      with:
        context: .
        file: "./Dockerfile.TACTIC"
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        secrets: |
          silva_app_token=${{ secrets.SILVA_APP_TOKEN }}
        build-args: |
          GIT_TAG=${{ github.ref_name }}

    - name: Build and export archive
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v5
      with:
        context: .
        file: "./Dockerfile.TACTIC"
        tags: ${{ steps.meta.outputs.tags }}
        outputs: type=tar,dest=image.tar
        secrets: |
          silva_app_token=${{ secrets.SILVA_APP_TOKEN }}
        build-args: |
          GIT_TAG=${{ github.ref_name }}

    - name: Compress image tar
      if: startsWith(github.ref, 'refs/tags/')
      run: gzip image.tar

    - name: Create Github Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          image.tar.gz
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
