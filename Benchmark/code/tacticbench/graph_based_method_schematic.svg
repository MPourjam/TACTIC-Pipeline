<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Graph-based split and merge diagnostics</title>
  <desc id="desc">Bipartite graph between inferred and expected features with threshold-based edges and formulas for split index, merge index, and unmapped fraction.</desc>

  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .title { font: 700 34px 'DejaVu Sans', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'DejaVu Sans', Arial, sans-serif; fill: #334155; }
      .h2 { font: 700 22px 'DejaVu Sans', Arial, sans-serif; fill: #0f172a; }
      .txt { font: 500 16px 'DejaVu Sans', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 14px 'DejaVu Sans', Arial, sans-serif; fill: #374151; }
      .formula { font: 600 17px 'DejaVu Sans Mono', 'Courier New', monospace; fill: #111827; }
      .inferred { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.7; }
      .expected { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.7; }
      .clustered { fill: #fef3c7; stroke: #d97706; stroke-width: 1.7; }
      .edge-asv { stroke: #3b82f6; stroke-width: 2.6; }
      .edge-cluster { stroke: #f59e0b; stroke-width: 2.6; stroke-dasharray: 8 6; }
      .legend-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .badge { fill: #0ea5e9; }
      .badgeText { font: 700 13px 'DejaVu Sans', Arial, sans-serif; fill: #ffffff; }
      .arrow { marker-end: url(#arrowhead); }
    </style>

    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="60" y="62">Figure 09: Graph-based Split and Merge Diagnostics</text>
  <text class="subtitle" x="60" y="94">Bipartite matching view used to quantify over-splitting, over-merging, and unmapped expected features</text>

  <rect class="panel" x="50" y="130" width="860" height="520" rx="14"/>
  <text class="h2" x="80" y="168">1) Build a thresholded bipartite graph</text>

  <text class="h2" x="120" y="220">Inferred features</text>
  <text class="h2" x="630" y="220">Expected features</text>

  <ellipse class="inferred" cx="220" cy="285" rx="86" ry="34"/>
  <text class="txt" x="176" y="290">ASV_13</text>

  <ellipse class="inferred" cx="220" cy="380" rx="86" ry="34"/>
  <text class="txt" x="176" y="385">ASV_14</text>

  <ellipse class="inferred" cx="220" cy="475" rx="86" ry="34"/>
  <text class="txt" x="176" y="480">ASV_22</text>

  <ellipse class="expected" cx="740" cy="255" rx="118" ry="32"/>
  <text class="txt" x="666" y="260">Tip: Bv__Copy2</text>

  <ellipse class="expected" cx="740" cy="340" rx="118" ry="32"/>
  <text class="txt" x="666" y="345">Tip: Bv__Copy5</text>

  <ellipse class="expected" cx="740" cy="425" rx="118" ry="32"/>
  <text class="txt" x="656" y="430">Tip: Sa__Copy1</text>

  <ellipse class="expected" cx="740" cy="510" rx="118" ry="32"/>
  <text class="txt" x="655" y="515">Tip: Se__Copy3</text>

  <line class="edge-asv" x1="304" y1="278" x2="622" y2="258"/>
  <line class="edge-asv" x1="304" y1="290" x2="622" y2="338"/>
  <line class="edge-asv" x1="304" y1="370" x2="622" y2="338"/>
  <line class="edge-asv" x1="304" y1="388" x2="622" y2="428"/>
  <line class="edge-asv" x1="304" y1="470" x2="622" y2="512"/>

  <circle class="badge" cx="470" cy="248" r="16"/>
  <text class="badgeText" x="464" y="253">1</text>
  <circle class="badge" cx="470" cy="329" r="16"/>
  <text class="badgeText" x="464" y="334">2</text>
  <circle class="badge" cx="470" cy="402" r="16"/>
  <text class="badgeText" x="464" y="407">3</text>

  <text class="small" x="335" y="560">Node degree on inferred side contributes to Merge Index</text>
  <text class="small" x="335" y="584">Node degree on expected side contributes to Split Index</text>

  <rect class="legend-box" x="960" y="130" width="390" height="300" rx="12"/>
  <text class="h2" x="988" y="168">Edge inclusion rules</text>

  <line class="edge-asv" x1="988" y1="204" x2="1088" y2="204"/>
  <text class="txt" x="1100" y="210">ASV / zOTU: pident >= denoising_threshold</text>
  <text class="small" x="1100" y="233">Default: 1.000 (100%)</text>

  <line class="edge-cluster" x1="988" y1="270" x2="1088" y2="270"/>
  <text class="txt" x="1100" y="276">TIC / TAC / UPARSE: pident >= method threshold</text>
  <text class="small" x="1100" y="299">Defaults: TIC,TAC 0.987 and UPARSE 0.970</text>

  <ellipse class="clustered" cx="1038" cy="352" rx="74" ry="24"/>
  <text class="small" x="998" y="357">Species node</text>
  <text class="small" x="1125" y="357">For clustering methods, expected tips can be collapsed by species</text>

  <rect class="panel" x="50" y="680" width="1300" height="180" rx="14"/>
  <text class="h2" x="80" y="718">2) Per-community metrics computed from the graph</text>

  <text class="formula" x="90" y="760">Split Index = (sum over expected nodes max(0, degree_expected - 1)) / denominator</text>
  <text class="small" x="980" y="760">denominator default: mapped expected nodes</text>

  <text class="formula" x="90" y="794">Merge Index = (sum over inferred nodes max(0, degree_inferred - 1)) / inferred_present_count</text>

  <text class="formula" x="90" y="828">Unmapped Feature Fraction = 1 - (mapped_expected_count / expected_present_count)</text>

  <path d="M912 470 C980 490, 1010 530, 1035 560" stroke="#475569" stroke-width="2.2" fill="none" class="arrow"/>
  <text class="small" x="1048" y="568">These distributions are then compared across methods in Figure 09</text>
</svg>
